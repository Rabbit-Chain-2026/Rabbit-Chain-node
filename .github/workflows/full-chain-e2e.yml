name: Full-Chain E2E

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout rabbitchain-chain
        uses: actions/checkout@v4
        with:
          path: rabbitchain-chain

      - name: Checkout rabbitchain-mining-stack
        uses: actions/checkout@v4
        with:
          repository: rabbitchain-chain-devs/rabbitchain-mining-stack
          path: rabbitchain-mining-stack

      - name: Checkout rabbitchain-explorer
        uses: actions/checkout@v4
        with:
          repository: rabbitchain-chain-devs/rabbitchain-explorer
          path: rabbitchain-explorer

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Rust builds
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: |
            rabbitchain-chain -> target
            rabbitchain-mining-stack -> target
            rabbitchain-explorer/backend -> target

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: rabbitchain-explorer/frontend/package-lock.json

      - name: Run full-chain E2E
        working-directory: rabbitchain-chain
        env:
          MINING_STACK_DIR: ${{ github.workspace }}/rabbitchain-mining-stack
          EXPLORER_DIR: ${{ github.workspace }}/rabbitchain-explorer
        run: bash scripts/full_chain_e2e.sh

      - name: Upload full-chain report and logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: full-chain-e2e
          path: |
            rabbitchain-chain/artifacts/release-gate/full-chain-e2e-report.md
            rabbitchain-chain/artifacts/full-chain-e2e-logs
